<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="setup-title setup-desc">
<title id="setup-title">The Quina Musical's setup on the night</title>
<desc id="setup-desc">The show laptop at the venue runs the relay, the show page (the engine, on the projector over HDMI, with all the audio by cable to the mixing desk and the PA) and the cloud link; it runs the show alone if the internet fails. The tablet's console talks to the relay over phone A's hotspot, the Wii remote pairs with the laptop by Bluetooth, and phone A's USB tethering gives the laptop its internet. In Cloudflare, the Worker quina-cloud and its GameRoom keep the Game, feed the players' phones read-only over /feed, and serve Admin and the cloud console behind Access; R2 holds the media, synced before the night.</desc>
<style>
svg { color-scheme: light dark;
  --bg: #f6f8fa; --panel: #ffffff; --box: #ffffff; --laptop: #eef4fc; --inner: #ffffff;
  --cloud: #fff6ee; --text: #1f2328; --muted: #4f5964; --line: #59636e; --border: #6e7781;
  --laptop-border: #0a5fc4; --cloud-border: #b34700; --accent-text: #0a55b0; --cloud-text: #9a3d00; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #0d1117; --panel: #121820; --box: #1a212b; --laptop: #14243a; --inner: #1a2a42;
    --cloud: #261a10; --text: #e6edf3; --muted: #aab4bf; --line: #8f99a4; --border: #8f99a4;
    --laptop-border: #5a9cf8; --cloud-border: #f0883e; --accent-text: #8ec0ff; --cloud-text: #ffb27a; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); font-size: 14px; }
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
.box { fill: var(--box); stroke: var(--border); stroke-width: 1.5; }
.inner { fill: var(--inner); stroke: var(--border); stroke-width: 1.5; }
.laptop { fill: var(--laptop); stroke: var(--laptop-border); stroke-width: 2.5; }
.cloud { fill: var(--cloud); stroke: var(--cloud-border); stroke-width: 2.5; }
.opt { stroke-dasharray: 8 6; }
.title { font-size: 26px; font-weight: 700; }
.h { font-size: 18px; font-weight: 700; }
.h.laptop-h { fill: var(--accent-text); }
.h.cloud-h { fill: var(--cloud-text); }
.t { font-size: 15px; font-weight: 700; }
.b { font-size: 14px; }
.s { font-size: 13px; }
.m { fill: var(--muted); font-size: 13px; }
.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
.strong { font-weight: 700; }
.lbl { font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.lbl.on-panel { stroke: var(--panel); }
.lbl.on-cloud { stroke: var(--cloud); }
.lbl.on-laptop { stroke: var(--laptop); }
.wire { fill: none; stroke: var(--line); stroke-width: 2; }
.wire.opt { stroke-dasharray: 8 6; }
.arrow { fill: var(--line); }
</style>
