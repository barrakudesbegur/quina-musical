name: Deploy to GitHub Pages

on:
  # Last year's site: redeploy only when a push to `main` changes it (legacy/2025) or this workflow.
  push:
    branches: [main]
    paths:
      - "legacy/2025/**"
      - ".github/workflows/deploy.yml"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Last year's app, kept as it was in legacy/2025 (its own npm workspace).
    defaults:
      run:
        working-directory: legacy/2025
    env:
      VITE_API_URL: "https://quina-api.barrakudesbegur.org"
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "legacy/2025/client/.nvmrc"

      - name: Install Dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: SPA fallback (404.html)
        run: |
          cp client/dist/index.html client/dist/404.html
          node -e "
          const fs = require('fs');

          const redirectScript = \`
          <script>
            (function () {
              var path = location.pathname + location.search + location.hash;
              sessionStorage.setItem('spa-redirect', path);
              location.replace('/');
            })();
          </script>
          \`;

          let html = fs.readFileSync('client/dist/404.html', 'utf8');
          html = html.replace('</head>', redirectScript + '</head>');
          fs.writeFileSync('client/dist/404.html', html);
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy/2025/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
